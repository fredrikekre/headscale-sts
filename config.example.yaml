# headscale-sts configuration
#
# The service listens on `listen` (keep it on localhost and front it with the
# reverse proxy that serves headscale) and mints preauth keys via the
# headscale API for workloads whose OIDC tokens match a rule.

listen: "127.0.0.1:8470"

headscale:
  # The headscale API; localhost when running on the headscale host.
  url: "http://127.0.0.1:8080"
  # API key from `headscale apikeys create`. Exactly one of api_key and
  # api_key_file must be set; prefer the file so that the key is not in the
  # config. Environment variables are expanded: with the bundled systemd
  # unit (DynamicUser + LoadCredential) the key from /etc/headscale-sts/apikey
  # is exposed to the service under $CREDENTIALS_DIRECTORY.
  api_key_file: "${CREDENTIALS_DIRECTORY}/apikey"

trusts:
  # GitHub Actions jobs (with `permissions: id-token: write`) request a
  # token with e.g.
  #   curl -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
  #     "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://headscale.example.org/sts"
  # (the token is in the .value field of the response)
  - issuer: https://token.actions.githubusercontent.com
    # The audience the workload must request; convention is the public URL
    # of this service.
    audience: https://headscale.example.org/sts
    rules:
      # First matching rule wins. All claims in `match` must equal the
      # token's claims (scalar claims only).
      - match:
          repository: fredrikekre/headscale-sts
          ref: refs/heads/main
        tags: [tag:ci]
        # Optional; the defaults are as follows.
        key:
          ephemeral: true
          reusable: false
          expiry: 5m

  # Buildkite agents request a token with e.g.
  #   buildkite-agent oidc request-token --audience https://headscale.example.org/sts
  - issuer: https://agent.buildkite.com
    audience: https://headscale.example.org/sts
    rules:
      - match:
          organization_slug: example-org
          pipeline_slug: example-pipeline
          build_branch: main
        tags: [tag:buildkite-ci]
